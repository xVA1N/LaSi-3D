# Prüft und veröffentlicht LaSi 3D auf GitHub Pages, sobald sich etwas auf main ändert.
name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.versuch1.outputs.page_url || steps.versuch2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Berechnungen prüfen
        run: npm test
      - name: Website bauen
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      # Veröffentlichen; bei einer kurzen Störung von GitHub einmal nach 30 Sekunden wiederholen
      - id: versuch1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Kurz warten vor zweitem Versuch
        if: steps.versuch1.outcome == 'failure'
        run: sleep 30
      - id: versuch2
        if: steps.versuch1.outcome == 'failure'
        uses: actions/deploy-pages@v4
